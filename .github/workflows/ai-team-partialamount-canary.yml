name: AI Team - PartialAmount Canary

on:
  workflow_dispatch:
  push:
    branches:
      - codespaces-sync-2026-08-08
    paths:
      - ".github/workflows/ai-team-partialamount-canary.yml"

permissions:
  contents: read

jobs:
  brain-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate Project Brain structure
        run: python ERPPrototype/Tools/ProjectBrain/validate_project_brain.py --repo-root "$GITHUB_WORKSPACE"
      - name: Run deterministic PartialAmount mapper canary
        run: python ERPPrototype/Tools/ProjectBrain/change_mapper_v1.py --repo-root "$GITHUB_WORKSPACE" --field PartialAmount --canary --output "$RUNNER_TEMP/partialamount-canary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-canary
          path: ${{ runner.temp }}/partialamount-canary.json

  change-mapper:
    needs: brain-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run independent Change Mapper Reviewer
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt-file: .ai/prompts/change-mapper-reviewer.md
          output-schema-file: .ai/schemas/reviewer-findings.schema.json
          output-file: ${{ runner.temp }}/change-mapper.raw.json
          effort: medium
      - name: Deterministic Finding Gate
        run: |
          python ERPPrototype/Tools/AITeam/validate_agent_report.py \
            "$RUNNER_TEMP/change-mapper.raw.json" \
            --repo-root "$GITHUB_WORKSPACE" \
            --expected-sha "$GITHUB_SHA" \
            --lead-view "$RUNNER_TEMP/change-mapper.json"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewer-change-mapper
          path: ${{ runner.temp }}/change-mapper.json

  architecture:
    needs: brain-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run independent Architecture Reviewer
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt-file: .ai/prompts/architecture-reviewer.md
          output-schema-file: .ai/schemas/reviewer-findings.schema.json
          output-file: ${{ runner.temp }}/architecture.raw.json
          effort: medium
      - name: Deterministic Finding Gate
        run: |
          python ERPPrototype/Tools/AITeam/validate_agent_report.py \
            "$RUNNER_TEMP/architecture.raw.json" \
            --repo-root "$GITHUB_WORKSPACE" \
            --expected-sha "$GITHUB_SHA" \
            --lead-view "$RUNNER_TEMP/architecture.json"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewer-architecture
          path: ${{ runner.temp }}/architecture.json

  regression:
    needs: brain-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run independent Regression Reviewer
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt-file: .ai/prompts/regression-reviewer.md
          output-schema-file: .ai/schemas/reviewer-findings.schema.json
          output-file: ${{ runner.temp }}/regression.raw.json
          effort: medium
      - name: Deterministic Finding Gate
        run: |
          python ERPPrototype/Tools/AITeam/validate_agent_report.py \
            "$RUNNER_TEMP/regression.raw.json" \
            --repo-root "$GITHUB_WORKSPACE" \
            --expected-sha "$GITHUB_SHA" \
            --lead-view "$RUNNER_TEMP/regression.json"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewer-regression
          path: ${{ runner.temp }}/regression.json

  lead-integrator:
    needs: [change-mapper, architecture, regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download independent reports
        uses: actions/download-artifact@v4
        with:
          pattern: reviewer-*
          path: .ai-results/input
          merge-multiple: true
      - name: List lead inputs
        run: find .ai-results/input -maxdepth 1 -type f -print -exec cat {} \;
      - name: Run Lead Integrator
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt-file: .ai/prompts/lead-integrator.md
          output-schema-file: .ai/schemas/lead-report.schema.json
          output-file: ${{ runner.temp }}/lead-report.json
          effort: medium
      - name: Validate Lead report shape and commit
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'lead-report.json'
          d=json.loads(p.read_text())
          assert d['schemaVersion']==1
          assert d['mission']=='PartialAmount-AI-Team-Canary'
          sha=d['commitSha']; exp=os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-fA-F]{7,40}', sha)
          assert sha.lower().startswith(exp.lower()) or exp.lower().startswith(sha.lower())
          assert d['verdict'] in {'PASS','PASS_WITH_GAPS','FAIL'}
          print('LEAD REPORT GATE: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai-team-canary-final
          path: ${{ runner.temp }}/lead-report.json
