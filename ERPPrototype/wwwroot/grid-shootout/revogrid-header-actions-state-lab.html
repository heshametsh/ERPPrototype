<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RevoGrid Gate 5B-4 Header Actions Lab</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; color: #1f2937; }
        h1 { font-size: 20px; }
        #summary { font-weight: 700; margin: 12px 0; }
        .pass { color: #067647; }
        .fail { color: #b42318; }
        li { margin: 5px 0; }
    </style>
</head>
<body>
    <h1>RevoGrid Gate 5B-4 — Header Selection / Filter State / Sort State Lab</h1>
    <div id="summary">Running…</div>
    <ol id="results"></ol>

    <script type="module">
        import {
            createSortOnlyColumn,
            createRevoGridSort,
            getNextErpSortOrder,
            normalizeSortState,
            sortStatesEqual
        } from "/js/revoGridSort.js?v=20260821-gate5b4-keyboard-sort-1";
        import {
            createRevoGridColumnSelection,
            getVisibleColumnSelectionRange
        } from "/js/revoGridColumnSelection.js?v=20260821-gate5b4-keyboard-sort-1";
        import {
            excelFilterHeaderTemplate,
            eventTargetsElement
        } from "/js/revoGridExcelFilter.js?v=20260821-gate5b4-keyboard-sort-1";
        import {
            createRevoGridSelectionLifecycle,
            isSingleCellRange,
            logicalCellTarget
        } from "/js/revoGridSelectionLifecycle.js?v=20260821-gate5b4-keyboard-sort-1";

        const results = [];
        async function test(name, action) {
            let passed = false;
            let error = null;
            try { passed = Boolean(await action()); } catch (ex) { error = ex; }
            results.push({ name, passed, error });
        }

        function fakeH(tag, props, children = []) {
            return { tag, props: props || {}, children: Array.isArray(children) ? children : [children] };
        }

        class FakeGrid extends EventTarget {
            constructor(visibleRows = 200) {
                super();
                this.visibleRows = visibleRows;
                this.columns = [
                    { name: "Basket", prop: "basket" },
                    createSortOnlyColumn({ name: "Work Order Value", prop: "workOrderValue" }, "number")
                ];
                this.sortCalls = [];
                this.focusCalls = [];
                this.clearFocusCalls = 0;
                this.focusState = null;
                this.rangeState = null;
                this.selectionStore = {
                    set: (key, value) => {
                        if (key === "focus") this.focusState = value;
                        if (key === "range") this.rangeState = value;
                    }
                };
            }

            async getColumns() { return this.columns; }
            async getVisibleSource() {
                return Array.from({ length: this.visibleRows }, (_, i) => ({ i }));
            }
            async setCellsFocus(start, end, colType, rowType) {
                this.focusCalls.push({ start, end, colType, rowType });
                this.focusState = { ...start };
                this.rangeState = { x: start.x, y: start.y, x1: end.x, y1: end.y };
            }
            async clearFocus() {
                this.clearFocusCalls += 1;
                this.focusState = null;
                this.rangeState = null;
            }
            async getProviders() {
                return {
                    selection: {
                        get focusedStore() {
                            return this._owner.focusState
                                ? { entity: { store: this._owner.selectionStore } }
                                : null;
                        },
                        _owner: this
                    }
                };
            }

            async updateColumnSorting(column, order, additive) {
                this.sortCalls.push({ type: "sort", column, order, additive });
                this.dispatchEvent(new CustomEvent("aftersortingapply", {
                    detail: { sorting: { [column.prop]: order } }
                }));
            }

            async clearSorting() {
                this.sortCalls.push({ type: "clear" });
                this.dispatchEvent(new CustomEvent("aftersortingapply", {
                    detail: { sorting: undefined }
                }));
            }
        }

        function fakeHistory() {
            const adapters = new Map();
            const entries = [];
            return {
                entries,
                registerAdapter(key, adapter) {
                    adapters.set(key, adapter);
                    return () => adapters.delete(key);
                },
                record(entry) { entries.push(entry); },
                async replay(index, direction) {
                    const entry = entries[index];
                    await adapters.get(entry.adapterKey).apply(entry, direction);
                }
            };
        }

        function headerEvent(prop, pathItems) {
            const originalEvent = {
                target: pathItems[0] ?? null,
                composedPath: () => pathItems,
                preventDefault() {}
            };
            return new CustomEvent("headerclick", {
                cancelable: true,
                detail: { prop, originalEvent }
            });
        }

        function beforeHeaderEvent(prop, pathItems = []) {
            const originalEvent = {
                target: pathItems[0] ?? null,
                composedPath: () => pathItems,
                preventDefault() {}
            };
            return new CustomEvent("beforeheaderclick", {
                cancelable: true,
                detail: {
                    index: 0,
                    column: { prop },
                    originalEvent,
                    providers: {}
                }
            });
        }

        async function waitFor(predicate, timeoutMs = 1000) {
            const started = performance.now();
            while (!predicate()) {
                if (performance.now() - started > timeoutMs) {
                    throw new Error("Timed out waiting for async header action.");
                }
                await new Promise(resolve => setTimeout(resolve, 0));
            }
        }

        await test("Sort cycle is none → desc → asc → natural", () =>
            getNextErpSortOrder(undefined) === "desc" &&
            getNextErpSortOrder("desc") === "asc" &&
            getNextErpSortOrder("asc") === undefined);

        await test("Only valid one-column sort states normalize", () =>
            JSON.stringify(normalizeSortState({ field: "workOrderValue", order: "desc" })) ===
                JSON.stringify({ field: "workOrderValue", order: "desc" }) &&
            normalizeSortState({ field: "workOrderValue", order: "sideways" }) === null);

        await test("Equivalent sort states compare equal", () =>
            sortStatesEqual(
                { field: "workOrderValue", order: "desc" },
                { field: "workOrderValue", order: "desc" }));

        await test("Visible 200-row column range is exactly y=0..199", () => {
            const range = getVisibleColumnSelectionRange(200, 3);
            return range?.start?.x === 3 && range.start.y === 0 &&
                range.end.x === 3 && range.end.y === 199;
        });

        await test("Zero visible rows creates no column range", () =>
            getVisibleColumnSelectionRange(0, 2) === null);

        await test("Active filter icon remains visible and clearly active", () => {
            const tree = excelFilterHeaderTemplate(fakeH, {
                name: "Basket",
                prop: "basket",
                hasFilter: true
            });
            const button = tree.children[1];
            return button.props["aria-pressed"] === "true" &&
                button.props.style.opacity === "1" &&
                button.props.style.background === "#d8eefc" &&
                button.props.style.color === "#0b5f8a";
        });

        await test("Inactive filter icon stays present in normal state", () => {
            const tree = excelFilterHeaderTemplate(fakeH, {
                name: "Basket",
                prop: "basket",
                hasFilter: false
            });
            const button = tree.children[1];
            return button.props["aria-pressed"] === "false" &&
                button.props.style.background === "transparent";
        });

        await test("Filter popup keyboard ownership recognizes its own search input", () => {
            const popup = document.createElement("section");
            const input = document.createElement("input");
            popup.appendChild(input);
            const inside = {
                target: input,
                composedPath: () => [input, popup, document.body, document, window]
            };
            const outsideNode = document.createElement("div");
            const outside = {
                target: outsideNode,
                composedPath: () => [outsideNode, document.body, document, window]
            };
            return eventTargetsElement(inside, popup) &&
                !eventTargetsElement(outside, popup);
        });

        await test("Header body selects only currently visible rows", async () => {
            const grid = new FakeGrid(200);
            const controller = createRevoGridColumnSelection({ grid });

            // Exercise the same documented event shape emitted by Revo v4.
            grid.dispatchEvent(beforeHeaderEvent("basket"));
            await waitFor(() => grid.focusCalls.length === 1);

            controller.destroy();
            const focus = grid.focusCalls[0];
            return focus.start.y === 0 && focus.end.y === 199 &&
                focus.start.x === 0 && focus.end.x === 0;
        });

        await test("Whole-column selection keeps range but removes synthetic first-cell focus", async () => {
            const grid = new FakeGrid(200);
            const controller = createRevoGridColumnSelection({ grid });
            await controller.selectVisibleColumn("basket");
            controller.destroy();
            return grid.rangeState?.x === 0 && grid.rangeState?.y === 0 &&
                grid.rangeState?.x1 === 0 && grid.rangeState?.y1 === 199 &&
                grid.focusState === null;
        });

        await test("Single-cell range is eligible for logical focus preservation", () =>
            isSingleCellRange({ x: 2, y: 4, x1: 2, y1: 4 }) &&
            !isSingleCellRange({ x: 2, y: 4, x1: 2, y1: 6 }));

        await test("Logical cell target uses ClientKey + column prop", () => {
            const target = logicalCellTarget(
                { model: { clientKey: "row:abc" }, column: { prop: "basket" } },
                { x: 0, y: 0, x1: 0, y1: 0 }
            );
            return target?.clientKey === "row:abc" && target?.field === "basket";
        });

        await test("Filter lifecycle can preserve the same logical cell when its row moves", async () => {
            const rows = [
                { clientKey: "row:a" },
                { clientKey: "row:b" },
                { clientKey: "row:c" }
            ];
            const grid = {
                rows: [...rows],
                focusCalls: [],
                clearFocusCalls: 0,
                async getFocused() {
                    return {
                        model: rows[1],
                        column: { prop: "basket" },
                        rowIndex: 1,
                        colIndex: 0,
                        colType: "rgCol",
                        rowType: "rgRow"
                    };
                },
                async getSelectedRange() {
                    return { x: 0, y: 1, x1: 0, y1: 1, colType: "rgCol", rowType: "rgRow" };
                },
                async getVisibleSource() { return this.rows; },
                async getColumns() { return [{ prop: "basket" }]; },
                async setCellsFocus(start, end, colType, rowType) {
                    this.focusCalls.push({ start, end, colType, rowType });
                },
                async clearFocus() { this.clearFocusCalls += 1; }
            };
            const lifecycle = createRevoGridSelectionLifecycle({ grid });
            await lifecycle.runWithPreservedCellSelection(async () => {
                grid.rows = [rows[1], rows[2], rows[0]];
            });
            const focus = grid.focusCalls.at(-1);
            return focus?.start?.y === 0 && focus?.start?.x === 0 &&
                grid.clearFocusCalls === 0;
        });

        await test("Sort visible-only policy keeps the cell only when it remains on screen", async () => {
            const rows = Array.from({ length: 20 }, (_, i) => ({ clientKey: `row:${i}` }));
            const selected = rows[2];
            let focusModel = selected;
            const grid = {
                rows: [...rows],
                focusCalls: [],
                clearFocusCalls: 0,
                async getFocused() {
                    return { model: focusModel, column: { prop: "basket" } };
                },
                async getSelectedRange() { return { x: 0, y: 2, x1: 0, y1: 2 }; },
                async getVisibleSource() { return this.rows; },
                async getColumns() { return [{ prop: "basket" }]; },
                async getProviders() {
                    return {
                        column: {
                            getColumnByProp: prop => prop === "basket" ? { prop: "basket" } : null,
                            getColumnIndexByProp: () => 0
                        },
                        dimension: {
                            stores: {
                                rgRow: { getCurrentState: () => ({ originItemSize: 20, sizes: {}, realSize: 400 }) },
                                rgCol: { getCurrentState: () => ({ originItemSize: 100, sizes: {}, realSize: 100 }) }
                            },
                            getViewPortPos: ({ coordinate, dimension }) =>
                                dimension === "rgRow" ? coordinate * 20 : coordinate * 100
                        },
                        viewport: {
                            stores: {
                                rgRow: { lastCoordinate: 0, store: { get: key => key === "virtualSize" ? 100 : 100 } },
                                rgCol: { lastCoordinate: 0, store: { get: key => key === "virtualSize" ? 100 : 100 } }
                            }
                        }
                    };
                },
                async setCellsFocus(start, end, colType, rowType) {
                    this.focusCalls.push({ start, end, colType, rowType });
                },
                async clearFocus() { this.clearFocusCalls += 1; }
            };

            const lifecycle = createRevoGridSelectionLifecycle({ grid });
            await lifecycle.runWithPreservedCellSelection(async () => {
                // row:2 moves from y=2 to y=4; 20px rows + 100px viewport => still visible.
                grid.rows = rows.filter((_, i) => i !== 2);
                grid.rows.splice(4, 0, selected);
            }, { restorePolicy: "visible-only" });
            const visibleFocus = grid.focusCalls.at(-1);
            const keptVisible = visibleFocus?.start?.y === 4 && grid.clearFocusCalls === 0;

            grid.focusCalls.length = 0;
            await lifecycle.runWithPreservedCellSelection(async () => {
                // Same Work Order moves to y=15, outside the unchanged viewport.
                grid.rows = rows.filter((_, i) => i !== 2);
                grid.rows.splice(15, 0, selected);
            }, { restorePolicy: "visible-only" });

            return keptVisible && grid.focusCalls.length === 0 && grid.clearFocusCalls === 1;
        });

        await test("Filter lifecycle clears cell focus when the selected Work Order is hidden", async () => {
            const selected = { clientKey: "row:b" };
            const grid = {
                rows: [{ clientKey: "row:a" }, selected],
                focusCalls: [],
                clearFocusCalls: 0,
                async getFocused() { return { model: selected, column: { prop: "basket" } }; },
                async getSelectedRange() { return { x: 0, y: 1, x1: 0, y1: 1 }; },
                async getVisibleSource() { return this.rows; },
                async getColumns() { return [{ prop: "basket" }]; },
                async setCellsFocus(start, end, colType, rowType) {
                    this.focusCalls.push({ start, end, colType, rowType });
                },
                async clearFocus() { this.clearFocusCalls += 1; }
            };
            const lifecycle = createRevoGridSelectionLifecycle({ grid });
            await lifecycle.runWithPreservedCellSelection(async () => {
                grid.rows = [{ clientKey: "row:a" }];
            });
            return grid.focusCalls.length === 0 && grid.clearFocusCalls === 1;
        });

        await test("Empty filtered result clears focus instead of selecting hidden rows", async () => {
            const grid = new FakeGrid(0);
            const controller = createRevoGridColumnSelection({ grid });
            await controller.selectVisibleColumn("basket");
            controller.destroy();
            return grid.focusCalls.length === 0 && grid.clearFocusCalls === 1;
        });

        await test("Sort icon uses Revo native sorting API and records one History action", async () => {
            const grid = new FakeGrid(200);
            const history = fakeHistory();
            const sort = createRevoGridSort({
                grid,
                datasetKey: "work-orders:2026",
                historyCoordinator: history
            });
            const button = document.createElement("button");
            button.className = "erp-revo-sort-button";
            button.setAttribute("data-erp-sort-prop", "workOrderValue");

            grid.dispatchEvent(headerEvent("workOrderValue", [button]));
            await waitFor(() => history.entries.length === 1 && !sort.getState().sortBusy);

            const state = sort.getSortState();
            const ok = grid.sortCalls.length === 1 &&
                grid.sortCalls[0].type === "sort" &&
                grid.sortCalls[0].order === "desc" &&
                state.field === "workOrderValue" && state.order === "desc" &&
                history.entries.length === 1;
            sort.destroy();
            return ok;
        });

        await test("Second sort click reverses; third click clears to natural order", async () => {
            const grid = new FakeGrid(200);
            const history = fakeHistory();
            const sort = createRevoGridSort({
                grid,
                datasetKey: "work-orders:2026",
                historyCoordinator: history
            });
            const button = document.createElement("button");
            button.className = "erp-revo-sort-button";
            button.setAttribute("data-erp-sort-prop", "workOrderValue");

            for (let expected = 1; expected <= 3; expected += 1) {
                grid.dispatchEvent(headerEvent("workOrderValue", [button]));
                await waitFor(() => history.entries.length === expected && !sort.getState().sortBusy);
            }

            const ok = grid.sortCalls.map(x => x.type === "clear" ? "clear" : x.order).join(",") ===
                    "desc,asc,clear" &&
                sort.getSortState() === null &&
                history.entries.length === 3;
            sort.destroy();
            return ok;
        });

        await test("Sort History replay uses the same native API and does not record again", async () => {
            const grid = new FakeGrid(200);
            const history = fakeHistory();
            const sort = createRevoGridSort({
                grid,
                datasetKey: "work-orders:2026",
                historyCoordinator: history
            });
            const button = document.createElement("button");
            button.className = "erp-revo-sort-button";
            button.setAttribute("data-erp-sort-prop", "workOrderValue");

            grid.dispatchEvent(headerEvent("workOrderValue", [button]));
            await waitFor(() => history.entries.length === 1 && !sort.getState().sortBusy);
            await history.replay(0, "undo");
            const afterUndo = sort.getSortState();
            await history.replay(0, "redo");
            const afterRedo = sort.getSortState();

            const ok = history.entries.length === 1 &&
                afterUndo === null &&
                afterRedo?.field === "workOrderValue" && afterRedo?.order === "desc";
            sort.destroy();
            return ok;
        });

        await test("Sort control click does not become whole-column selection", async () => {
            const grid = new FakeGrid(200);
            const history = fakeHistory();
            const sort = createRevoGridSort({
                grid,
                datasetKey: "work-orders:2026",
                historyCoordinator: history
            });
            const selection = createRevoGridColumnSelection({ grid });
            const button = document.createElement("button");
            button.className = "erp-revo-sort-button";
            button.setAttribute("data-erp-sort-prop", "workOrderValue");

            // Selection sees the early event and must stand down for the
            // dedicated control. Sort then receives the normal headerclick.
            grid.dispatchEvent(beforeHeaderEvent("workOrderValue", [button]));
            grid.dispatchEvent(headerEvent("workOrderValue", [button]));
            await waitFor(() => history.entries.length === 1 && !sort.getState().sortBusy);
            await new Promise(resolve => setTimeout(resolve, 0));
            const ok = grid.focusCalls.length === 0;
            selection.destroy();
            sort.destroy();
            return ok;
        });

        await test("Filter control click does not become whole-column selection", async () => {
            const grid = new FakeGrid(200);
            const selection = createRevoGridColumnSelection({ grid });
            const button = document.createElement("button");
            button.setAttribute("data-erp-filter-prop", "basket");
            grid.dispatchEvent(beforeHeaderEvent("basket", [button]));
            await new Promise(resolve => setTimeout(resolve, 0));
            const ok = grid.focusCalls.length === 0;
            selection.destroy();
            return ok;
        });

        const list = document.getElementById("results");
        let passed = 0;
        for (const result of results) {
            const li = document.createElement("li");
            li.className = result.passed ? "pass" : "fail";
            li.textContent = `${result.passed ? "PASS" : "FAIL"} — ${result.name}${result.error ? `: ${result.error.message}` : ""}`;
            list.appendChild(li);
            if (result.passed) passed += 1;
        }
        const failed = results.length - passed;
        const summary = document.getElementById("summary");
        summary.textContent = `PASS ${passed} / FAIL ${failed}`;
        summary.className = failed === 0 ? "pass" : "fail";
    </script>
</body>
</html>
